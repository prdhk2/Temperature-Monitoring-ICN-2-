; ICN-2 temperature monitor (5x MAX31856 thermocouple, Nextion HMI, relay /
; reject panel, LFS flow meters) - Depok
; https://docs.platformio.org/page/projectconf.html
;
; Converted from the Arduino sketch biodigester_esp32_v4.4.ino. Pins and
; serial protocols are unchanged; uploads go to monitoring.xampah.com and
; the controller joins the fleet (status, remote log, OTA) as site
; "depok_icn2", like ICN-Control-MQTT.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 9600
monitor_filters = time, esp32_exception_decoder

; OTA needs two app slots: one running, one to download into. "default.csv"
; is the stock OTA-capable table (nvs, otadata, 2x 1.25 MB app, spiffs) and
; the same table the Arduino IDE uses for "ESP32 Dev Module", so the NVS
; (EEPROM alarm limits) stays where it was. The first flash must be over USB.
board_build.partitions = default.csv

; Credentials (API key, MQTT login) are never committed: put them in
; secrets.ini (gitignored; copy secrets.ini.example), which this script turns
; into -D defines.
extra_scripts = pre:scripts/load_secrets.py

lib_deps =
	adafruit/Adafruit MAX31856 library@^1.2.5
	knolleary/PubSubClient@^2.8

build_flags =
	; PubSubClient's 256-byte default silently drops the status payload and
	; OTA commands. Mirrored by Config::MQTT_PACKET_SIZE.
	-D MQTT_MAX_PACKET_SIZE=2048
	; UART0 (Serial) is ALSO the LFS flow-meter bus. Debug text on it is fine
	; on the bench, but in the field it would be sent to the meters and
	; collide with their answers - the release env turns it off.
	-D DP_SERIAL_DEBUG=1

; Release / OTA image: refuses to compile without the API key and MQTT login
; (include/config.h), and keeps the LFS bus free of debug text (debug lines
; still reach the dashboard's live log over MQTT).
; ALWAYS build OTA uploads with this env:
;   pio run -e release  ->  .pio/build/release/firmware.bin
[env:release]
extends = env:esp32dev
build_flags =
	-D MQTT_MAX_PACKET_SIZE=2048
	-D DP_SERIAL_DEBUG=0
	-D DP_RELEASE_BUILD

; PC-host unit tests for the pure logic in lib/IcnCore (sensor filter, serial
; framing, limit decoding, JSON extraction, log queue, OTA rollback).
; Needs a host C++ compiler:
;   pio test -e native
[env:native]
platform = native
build_flags =
	-std=c++17
	-Wall
	-Wextra
test_framework = unity
build_src_filter =
	-<*>
